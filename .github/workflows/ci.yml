name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs. On a free plan the minutes are the constraint, and a
# push that lands while an older run is still going makes that run worthless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  # Path filtering: a CSS change must not spend four minutes rebuilding .NET.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      dotnet: ${{ steps.filter.outputs.dotnet }}
      node: ${{ steps.filter.outputs.node }}
      schema: ${{ steps.filter.outputs.schema }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            dotnet:
              - '**/*.cs'
              - '**/*.csproj'
              - '**/*.sql'
              - 'Directory.*.props'
              - '.globalconfig'
              - 'Shellwright.slnx'
              - 'tests/fixtures/**'
              # The Android shell is the Android template, so editing it
              # changes generated output and must run the golden tests.
              - 'shells/android/**'
            node:
              - '**/*.ts'
              - '**/*.tsx'
              - '**/package.json'
              - 'pnpm-lock.yaml'
              - 'tsconfig*.json'
              - 'eslint.config.js'
              - 'turbo.json'
              - 'tests/fixtures/**'
            schema:
              - 'packages/config-schema/schema/**'

  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - uses: actions/checkout@v4
        with:
          # commitlint walks the range between base and head, so the shallow
          # default checkout leaves it with no revisions to compare.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prettier
        run: pnpm format:check
      - name: ESLint
        run: pnpm lint
      - name: Conventional commits
        if: github.event_name == 'pull_request'
        run: >
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

  node:
    name: Node build and test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.node == 'true' || needs.changes.outputs.schema == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The committed types must match the schema they are generated from. A
      # diff here means someone edited one without the other.
      - name: Generated types are current
        run: |
          pnpm --filter @shellwright/config-schema generate
          git diff --exit-code -- packages/config-schema/src/generated \
            || { echo "::error::Generated types are stale. Run: pnpm --filter @shellwright/config-schema generate"; exit 1; }

      - name: Typecheck
        run: pnpm typecheck
      - name: Test with coverage
        run: pnpm test:coverage
      - name: Build
        run: pnpm build
      - name: Bundle size budget
        run: pnpm --filter @shellwright/studio size

      # The goldens are the contract between the two validators. If the
      # TypeScript engine no longer reproduces them, one side has drifted.
      - name: Cross-language goldens are current
        run: |
          pnpm --filter @shellwright/config-schema exec tsx scripts/write-goldens.ts
          git diff --exit-code -- tests/fixtures/expected \
            || { echo "::error::Validator output changed. Review the diff, then commit the regenerated goldens."; exit 1; }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node-coverage
          path: '**/coverage/cobertura-coverage.xml'
          if-no-files-found: ignore

  dotnet:
    name: .NET build and test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.dotnet == 'true' || needs.changes.outputs.schema == 'true'

    # The control plane's tenant isolation is a PostgreSQL guarantee — policies,
    # role ownership, and grants — so its tests need a real server. There is no
    # in-memory provider that could disagree with them in a useful way.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # scripts/dev-postgres.sh creates the two roles and the database against
      # this, instead of starting a cluster of its own.
      SHELLWRIGHT_PG_ADMIN: Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres;Password=postgres

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The orchestrator's workflow tests run against a real Temporal dev
      # server, because what they check — that a non-retryable failure is
      # attempted once, that cancellation still runs the compensation — is
      # Temporal's behaviour rather than ours.
      - name: Install the Temporal CLI
        run: bash scripts/dev-temporal.sh

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet restore
      # TreatWarningsAsErrors is on repo-wide, so a warning fails here.
      - run: dotnet build --no-restore -c Release
      - name: Format check
        run: dotnet format --verify-no-changes --no-restore
      - name: Test with coverage
        run: >
          dotnet test --no-build -c Release
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage

      # The committed OpenAPI document and the TypeScript client generated from
      # it must match the route table they came from. A diff here means an
      # endpoint changed and its client did not, which is the drift this whole
      # arrangement exists to prevent.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated API client is current
        run: |
          bash scripts/generate-api-client.sh
          git diff --exit-code -- packages/api-client/openapi packages/api-client/src/generated \
            || { echo "::error::The API client is stale. Run: bash scripts/generate-api-client.sh"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dotnet-coverage
          path: coverage/**/coverage.cobertura.xml
          if-no-files-found: ignore

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Vulnerable NuGet packages
        run: |
          dotnet restore
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          grep -q "has the following vulnerable packages" vuln.txt \
            && { echo "::error::Vulnerable NuGet dependencies found."; exit 1; } || true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # No `cache: pnpm` here on purpose. This job audits the lockfile and
          # never runs `pnpm install`, so the pnpm store is never created — and
          # the action's post-step then fails the whole job trying to save a
          # directory that does not exist. There is also nothing worth caching.
      - name: Vulnerable npm packages
        # Reads pnpm-lock.yaml directly; no install needed.
        run: pnpm audit --audit-level high

  # One aggregated status check, so branch protection never needs reconfiguring
  # when a job is added. A skipped job must not be mistaken for a passing one.
  gate:
    name: gate
    runs-on: ubuntu-latest
    needs: [lint, node, dotnet, security]
    if: always()
    steps:
      - name: Check results
        run: |
          for result in \
            "lint=${{ needs.lint.result }}" \
            "node=${{ needs.node.result }}" \
            "dotnet=${{ needs.dotnet.result }}" \
            "security=${{ needs.security.result }}"
          do
            name="${result%%=*}"
            outcome="${result#*=}"
            case "$outcome" in
              success|skipped) echo "ok: $name ($outcome)" ;;
              *) echo "::error::$name failed ($outcome)"; failed=1 ;;
            esac
          done
          exit "${failed:-0}"
