# Pre-commit budget is 3 seconds. Anything slower belongs in CI, not here —
# a hook you disable is a hook that does nothing. (S00 T-00.4)
pre-commit:
  parallel: true
  commands:
    format:
      glob: '*.{ts,tsx,js,json,md,yml,yaml}'
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true
    secrets:
      run: |
        if command -v gitleaks >/dev/null 2>&1; then
          gitleaks protect --staged --redact --config .gitleaks.toml
        else
          echo "gitleaks not installed locally — CI will still gate this commit."
        fi

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
