# XcodeGen spec.
#
# The Xcode project is generated rather than committed. A .pbxproj is a merge
# conflict generator, and — more to the point for this product — Sprint 04 has
# to *generate* an iOS project from a config. A declarative spec is a much
# better target for that than hand-edited XML, so the shell is built the way the
# generator will have to build it.
#
#   brew install xcodegen && xcodegen generate
name: 'shellwright_dev'
options:
  bundleIdPrefix: dev.shellwright
  deploymentTarget:
    iOS: '15.0'
  createIntermediateGroups: true

packages:
  ShellCore:
    path: .

settings:
  base:
    SWIFT_VERSION: '6.0'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Warnings are errors here for the same reason they are everywhere else in
    # this repository (01_ENGINEERING_STANDARDS.md §3).
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
  configs:
    release:
      # Whole-module optimisation and dead-code stripping: the IPA budget is
      # 25 MB and the startup budget is 300 ms to first frame.
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: '-O'
      DEAD_CODE_STRIPPING: YES
      STRIP_INSTALLED_PRODUCT: YES
      ENABLE_TESTABILITY: NO

targets:
  Shellwright:
    type: application
    platform: iOS
    sources:
      - path: Sources/ShellApp
      - path: Resources
    dependencies:
      - package: ShellCore
        product: ShellCore
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: 'Shellwright Dev'
        CFBundleShortVersionString: '1.0.0'
        CFBundleVersion: '1'

        # ⚠️ Saves the customer a manual question on every single TestFlight
        # upload. Omitting the key does not default it — App Store Connect
        # stops and asks, every time, forever.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          # A storyboard-free launch screen whose colour the generator rewrites
          # from `config.branding.splash.backgroundColor`. A static image could
          # not adapt to the config.
          UIColorName: SplashBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

        # ⚠️ iPad is judged separately at review: an app that restricts
        # orientation there is rejected without justification, and the same app
        # may legitimately be portrait-only on iPhone.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

        # ⚠️ Usage strings exist only for capabilities the config enables, and
        # this cuts both ways. A missing string does not degrade: the system
        # kills the app the instant a web form asks for the camera. A string
        # for a capability the app cannot reach is flagged by Apple's static
        # analysis and rejected. Neither error is visible before it happens.

        # ⚠️ No NSAllowsArbitraryLoads. Sprint 01 rejects http:// at config
        # time, so App Transport Security stays strict — and an ATS exception
        # is a flag during App Review.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: 'dev.shellwright.shell'
        TARGETED_DEVICE_FAMILY: '1,2'
        MARKETING_VERSION: '1.0.0'
        CURRENT_PROJECT_VERSION: '1'

        # ⚠️ A placeholder, never a value. The signing identity is
        # customer-specific and, from Sprint 14, secret — it is supplied by the
        # build environment at build time and must never be baked into a
        # generated project that gets exported or cached.
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: $(SHELLWRIGHT_TEAM_ID)
        PROVISIONING_PROFILE_SPECIFIER: $(SHELLWRIGHT_PROFILE)
    entitlements:
      path: Resources/Shellwright.entitlements
