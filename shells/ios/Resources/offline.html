<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline</title>
    <style>
      /*
    Bundled, never remote — an offline page fetched from the network would
    defeat its own purpose. Colours are substituted from config.branding.theme
    at load time by ShellWebViewClient.
  */
      :root {
        --bg: __BACKGROUND__;
        --fg: __FOREGROUND__;
        --accent: __ACCENT__;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        font:
          16px/1.55 -apple-system,
          system-ui,
          'Segoe UI',
          Roboto,
          sans-serif;
        text-align: center;
      }
      .card {
        max-width: 320px;
      }
      svg {
        width: 56px;
        height: 56px;
        opacity: 0.5;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 24px;
        opacity: 0.75;
      }
      button {
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: var(--accent);
        border: 0;
        border-radius: 10px;
        padding: 12px 28px;
        cursor: pointer;
        min-height: 48px; /* a comfortable tap target */
      }
      button:active {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.75"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <path
          d="M1 1l22 22M16.7 16.7A6 6 0 0 0 8 8.3M5 12.5a10 10 0 0 1 3-2.2M2 8.8a15 15 0 0 1 4-2.7M12 20h.01"
        />
      </svg>
      <h1>__TITLE__</h1>
      <p>__BODY__</p>
      <button id="retry" type="button">__RETRY__</button>
    </div>
    <script>
      // The shell reloads the failed URL rather than this page, so the button asks
      // the shell rather than calling history.back().
      document.getElementById('retry').addEventListener('click', function () {
        if (window.ShellwrightOffline && window.ShellwrightOffline.retry) {
          window.ShellwrightOffline.retry();
        } else {
          location.reload();
        }
      });
    </script>
  </body>
</html>
