# Correctness
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# Build performance. These matter enormously once builds run thousands of times
# a month on metered runners (SPRINT-02 T-02.1).
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
kotlin.incremental=true

# R8 full mode: a meaningful size and startup win, and the reason
# proguard-rules.pro has to be right rather than approximately right.
android.enableR8.fullMode=true
android.enableResourceOptimizations=true

# Reproducibility: the generated app must be buildable identically forever.
android.suppressUnsupportedCompileSdk=
